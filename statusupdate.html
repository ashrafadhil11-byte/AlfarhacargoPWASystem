<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fafafa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Scan & Update | Al-Farha Cargo</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <!-- External Scanner Library -->
  <script src="scanner.js"></script>

  <style>
    :root { --bg-color: #fafafa; --card-bg: #ffffff; --border-color: #eaeaea; --text-main: #111827; --text-muted: #6b7280; --brand-accent: #6f42c1; --sidebar-width: 260px; }
    
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; overscroll-behavior-y: none; font-family: 'Comfortaa', cursive; color: var(--text-main); background-color: var(--bg-color); }
    
    .app-layout { display: flex; min-height: 100vh; }
    
    /* Main Content Area */
    .main-content { margin-left: var(--sidebar-width); flex: 1; padding: 48px 5%; width: calc(100% - var(--sidebar-width)); padding-bottom: 100px; transition: margin 0.3s ease; }
    .page-header { margin-bottom: 30px; }
    .page-title { font-family: 'Lexend', sans-serif; font-weight: 300; font-size: 2rem; letter-spacing: -0.03em; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
    .page-subtitle { color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; }
    
    /* Split Layout Grid */
    .split-grid { display: grid; grid-template-columns: 1fr; gap: 32px; }
    @media (min-width: 1100px) { .split-grid { grid-template-columns: 1fr 1fr; align-items: start; } }

    /* Cards & Tabs */
    .content-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.02); }
    .admin-tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; flex-wrap: wrap;}
    .tab-btn { background: none; border: none; font-family: 'Lexend', sans-serif; font-weight: 500; font-size: 0.85rem; color: var(--text-muted); padding: 8px 14px; border-radius: 8px; cursor: pointer; transition: all 0.2s ease; }
    .tab-btn:hover { color: var(--text-main); background: #f3f4f6; }
    .tab-btn.active { color: var(--brand-accent); background: #f3e8ff; }
    .tab-content { display: none; animation: fadeIn 0.4s ease; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    /* Inputs & Form Elements */
    .input-group { display: flex; flex-direction: column; margin-bottom: 20px; }
    .input-label { font-family: 'Lexend', sans-serif; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    .input-with-scanner { display: flex; gap: 8px; }
    .minimal-input { flex: 1; border-radius: 12px; padding: 14px 16px; border: 1px solid var(--border-color); background-color: #f8fafc; font-family: 'Comfortaa', cursive; font-weight: 600; color: var(--text-main); width: 100%; font-size: 0.95rem; transition: all 0.2s ease; }
    .minimal-input:focus { outline: none; border-color: var(--brand-accent); background-color: #ffffff; }
    textarea.minimal-input { min-height: 100px; resize: vertical; line-height: 1.5; }
    select.minimal-input { cursor: pointer; appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 1rem center; background-size: 1em; padding-right: 2.5rem; }

    .optional-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 600px) { .optional-grid { grid-template-columns: 1fr 1fr; } }

    /* Carrier Section Accordion */
    .carrier-toggle-btn { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; border: 1px dashed #cbd5e0; padding: 16px; border-radius: 12px; cursor: pointer; color: var(--text-main); font-family: 'Lexend', sans-serif; font-size: 0.95rem; font-weight: 500; transition: all 0.2s ease; margin: 24px 0; }
    .carrier-toggle-btn:hover { background: #f1f5f9; border-color: var(--brand-accent); color: var(--brand-accent); }
    .carrier-section { display: none; animation: fadeIn 0.3s ease; border: 1px solid var(--border-color); padding: 20px 20px 0 20px; border-radius: 12px; background: #fafafa; margin-bottom: 24px; }
    .carrier-section.expanded { display: block; }

    /* Action Buttons */
    .btn-icon { background-color: var(--brand-accent); color: white; border: none; border-radius: 12px; width: 50px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; transition: all 0.2s ease; }
    .btn-icon:hover { background-color: #5a32a3; }
    .btn-primary-custom { font-family: 'Lexend', sans-serif; font-weight: 500; background-color: var(--brand-accent); color: white; border: none; padding: 16px; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; font-size: 1rem; margin-top: 10px; }
    .btn-primary-custom:hover { background-color: #5a32a3; transform: translateY(-2px); }
    .btn-cancel-custom { font-family: 'Lexend', sans-serif; font-weight: 500; background-color: transparent; color: var(--text-muted); border: 1px solid var(--border-color); padding: 14px; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; width: 100%; margin-top: 12px; }
    
    .custom-alert { border-radius: 12px; font-family: 'Lexend', sans-serif; font-size: 0.9rem; padding: 16px; margin-bottom: 24px; }
    .divider { height: 1px; background-color: var(--border-color); margin: 24px 0; }
    .section-title { font-family: 'Lexend', sans-serif; font-weight: 500; font-size: 1.1rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px;}

    /* Modals */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(5px); z-index: 9999; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    .modal-overlay.active { opacity: 1; pointer-events: all; }
    .details-modal { background: var(--card-bg); border-radius: 24px; padding: 24px; max-width: 650px; width: 95%; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); border: 1px solid var(--border-color); transform: translateY(40px); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    .modal-overlay.active .details-modal { transform: translateY(0); }
    
    #scanner-container { width: 100%; max-height: 60vh; background: #000; border-radius: 12px; overflow: hidden; position: relative; display: flex; justify-content: center; align-items: center; margin-bottom: 16px; }
    #scanner-container video { width: 100%; height: auto; object-fit: cover; }
    .scan-guide { position: absolute; border: 2px solid #10b981; width: 70%; height: 100px; top: 50%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 0 100vmax rgba(0,0,0,0.5); pointer-events: none; }

    /* Responsive adjustment when sidebar is present */
    @media (max-width: 768px) {
      .main-content { margin-left: 0; width: 100%; padding: 24px 16px 100px 16px; }
      .page-title { font-size: 1.6rem; }
      .content-card { padding: 16px; }
      .admin-tabs { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 8px; -webkit-overflow-scrolling: touch; }
      .admin-tabs::-webkit-scrollbar { display: none; }
      .tab-btn { white-space: nowrap; }
    }
  </style>
</head>
<body>

<!-- Scanner Modal -->
<div class="modal-overlay" id="scannerModal">
  <div class="details-modal" style="padding: 16px;">
    <div class="section-title"><i class="bi bi-upc-scan text-primary"></i> Scan Barcode</div>
    <div id="scanner-container">
      <video id="camera-stream" playsinline autoplay></video>
      <div class="scan-guide"></div>
    </div>
    <button class="btn-cancel-custom" onclick="stopScanner()">Cancel Scan</button>
  </div>
</div>

<div class="app-layout">
  
  <!-- Navigation Container (Dynamically injected by nav.js) -->
  <div id="navigation-container"></div>

  <!-- Main Content Body -->
  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title"><i class="bi bi-upc-scan text-primary"></i> Scan & Update</h1>
      <p class="page-subtitle">Log milestones, backdate entries, and map 3rd-party tracking dockets directly from the field.</p>
    </div>

    <div class="split-grid">
      <div class="content-card">
        <div id="update-alert" class="alert d-none custom-alert" role="alert"></div>

        <div class="admin-tabs">
          <button class="tab-btn active" onclick="switchTab('single', this)"><i class="bi bi-box me-1"></i> Single</button>
          <button class="tab-btn" onclick="switchTab('bulk', this)"><i class="bi bi-boxes me-1"></i> Bulk</button>
          <button class="tab-btn" onclick="switchTab('consol', this)"><i class="bi bi-layers-half me-1"></i> Consolidation</button>
        </div>

        <!-- Single Update Tab -->
        <div id="tab-single" class="tab-content active">
          <div class="input-group">
            <label class="input-label">Booking ID / AWB</label>
            <div class="input-with-scanner">
              <input type="text" id="scanSingleId" class="minimal-input" placeholder="Enter AWB..." autocomplete="off">
              <button class="btn-icon" onclick="startScanner('scanSingleId')"><i class="bi bi-qr-code-scan"></i></button>
            </div>
          </div>
        </div>

        <!-- Bulk Update Tab -->
        <div id="tab-bulk" class="tab-content">
          <div class="input-group">
            <label class="input-label">Multiple Booking IDs</label>
            <div class="input-with-scanner">
              <textarea id="scanBulkIds" class="minimal-input" placeholder="Scan sequentially or paste..." autocomplete="off"></textarea>
              <button class="btn-icon" style="height: auto;" onclick="startScanner('scanBulkIds', true)"><i class="bi bi-qr-code-scan"></i></button>
            </div>
          </div>
        </div>

        <!-- Consolidation Update Tab -->
        <div id="tab-consol" class="tab-content">
          <div class="input-group">
            <label class="input-label">Master Consolidation ID</label>
            <div class="input-with-scanner">
              <input type="text" id="scanConsolId" class="minimal-input" placeholder="Enter Master Bag..." autocomplete="off">
              <button class="btn-icon" onclick="startScanner('scanConsolId')"><i class="bi bi-qr-code-scan"></i></button>
            </div>
          </div>
        </div>

        <!-- Shared Status Fields -->
        <div id="sharedUpdateFields">
          <div class="divider"></div>

          <div class="input-group">
            <label class="input-label">New Status Milestone <span style="color: #dc2626;">*</span></label>
            <select id="scanStatus" class="minimal-input">
              <option value="" disabled selected>Select Milestone...</option>
              <option value="Picked Up">Picked Up</option>
              <option value="In-Transit">In-Transit</option>
              <option value="Delivered">Delivered</option>
            </select>
          </div>

          <div class="optional-grid">
            <div class="input-group">
              <label class="input-label">Location (Optional)</label>
              <input type="text" id="scanLocation" class="minimal-input" placeholder="Leave blank for Branch">
            </div>
            <div class="input-group">
              <label class="input-label">Backdate (Optional)</label>
              <input type="datetime-local" id="scanDate" class="minimal-input">
            </div>
          </div>

          <div id="carrierWrapper">
            <div class="carrier-toggle-btn" onclick="toggleCarrierSection()">
              <span><i class="bi bi-airplane-engines me-2"></i> Assign Carrier</span>
              <i class="bi bi-chevron-down" id="carrierIcon"></i>
            </div>
            <div class="carrier-section" id="carrierSection">
              <div class="optional-grid">
                <div class="input-group">
                  <label class="input-label">Forwarding Agent</label>
                  <input type="text" id="fwdAgent" class="minimal-input">
                </div>
                <div class="input-group">
                  <label class="input-label">Carrier Docket</label>
                  <div class="input-with-scanner">
                    <input type="text" id="fwdDocket" class="minimal-input">
                    <button class="btn-icon" onclick="startScanner('fwdDocket')"><i class="bi bi-qr-code-scan"></i></button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <button id="updateBtn" class="btn-primary-custom" onclick="submitStatusUpdate()">
            <i class="bi bi-check2-circle"></i> Commit Record
          </button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Connect nav.js -->
<script src="nav.js"></script>
<script>
  // Initialize Page and Navbar on Load
  document.addEventListener("DOMContentLoaded", function() {
    if (typeof initNavigation === 'function') {
      initNavigation('StatusUpdate'); // Highlights 'StatusUpdate' in nav
    }
  });

  var sessionUser = JSON.parse(localStorage.getItem('afc_user') || '{"name":"Field User","branch":"Salalah"}');
  var activeTab = 'single'; 
  
  // --- SCANNER INTEGRATION ---
  let activeTargetInput = null;
  let isContinuousScan = false;

  function startScanner(targetInputId, continuous = false) {
    activeTargetInput = targetInputId;
    isContinuousScan = continuous;
    document.getElementById('scannerModal').classList.add('active');
    
    if (typeof initBarcodeScanner === 'function') {
      initBarcodeScanner('camera-stream', handleScanResult);
    } else {
      console.warn("scanner.js not loaded or initBarcodeScanner is undefined.");
    }
  }

  function handleScanResult(barcodeData) {
    const inputField = document.getElementById(activeTargetInput);
    if (isContinuousScan) {
      if (!inputField.value.includes(barcodeData)) {
        inputField.value = inputField.value ? inputField.value + ",\n" + barcodeData : barcodeData;
      }
    } else {
      inputField.value = barcodeData;
      stopScanner();
    }
    if(navigator.vibrate) navigator.vibrate(100);
  }

  function stopScanner() {
    document.getElementById('scannerModal').classList.remove('active');
    if (typeof stopBarcodeScanner === 'function') {
      stopBarcodeScanner();
    }
  }

  // --- UI TOGGLES ---
  function toggleCarrierSection() {
    const sec = document.getElementById('carrierSection');
    const icon = document.getElementById('carrierIcon');
    sec.classList.toggle('expanded');
    icon.className = sec.classList.contains('expanded') ? 'bi bi-chevron-up' : 'bi bi-chevron-down';
  }

  function switchTab(tabId, btnElement) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    btnElement.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    document.getElementById('tab-' + tabId).classList.add('active');
    activeTab = tabId;
  }

  // --- VERCEL TO GAS BACKEND API CALL ---
  const GAS_WEB_APP_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE"; 

  async function submitStatusUpdate() {
    const status = document.getElementById('scanStatus').value;
    const location = document.getElementById('scanLocation').value.trim();
    const customDate = document.getElementById('scanDate').value;
    
    let fwdAgent = activeTab === 'single' ? document.getElementById('fwdAgent').value.trim() : "";
    let fwdDocket = activeTab === 'single' ? document.getElementById('fwdDocket').value.trim() : "";
    
    if (!status) return alert('Please select a Status Milestone.');

    let actionName = '';
    let payloadArgs = [];
    const commonArgs = [status, sessionUser.name, sessionUser.branch, location, "", customDate, fwdAgent, fwdDocket];

    if (activeTab === 'single') {
      const singleId = document.getElementById('scanSingleId').value.trim();
      if (!singleId) return alert('Please enter or scan a Booking ID.');
      actionName = 'updateManualTrackingStatus';
      payloadArgs = [singleId, ...commonArgs];
    } else if (activeTab === 'bulk') {
      const rawIds = document.getElementById('scanBulkIds').value.trim();
      const bulkIds = rawIds.split(/[\n,]+/).map(id => id.trim()).filter(id => id !== '');
      if (bulkIds.length === 0) return alert('Please provide at least one Booking ID.');
      actionName = 'updateBulkManualTrackingStatus';
      payloadArgs = [bulkIds, ...commonArgs];
    } else if (activeTab === 'consol') {
      const consolId = document.getElementById('scanConsolId').value.trim();
      if (!consolId) return alert('Please enter a Master Consolidation ID.');
      actionName = 'updateConsolidationTrackingStatus';
      payloadArgs = [consolId, ...commonArgs];
    }

    await executeBackendApiCall(actionName, payloadArgs);
  }

  async function executeBackendApiCall(functionName, argsArray) {
    const btn = document.getElementById('updateBtn');
    btn.disabled = true;
    btn.innerHTML = 'Committing...';

    try {
      const response = await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: functionName, args: argsArray })
      });
      const result = await response.json();
      alert(result.message || 'Status updated successfully!');
      if (result.success) {
        // Clear inputs on success
        if (activeTab === 'single') document.getElementById('scanSingleId').value = '';
        if (activeTab === 'bulk') document.getElementById('scanBulkIds').value = '';
        if (activeTab === 'consol') document.getElementById('scanConsolId').value = '';
      }
    } catch (err) {
      alert('Connection Error: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-check2-circle"></i> Commit Record';
    }
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login - Al-Farha Cargo</title>
  
  <meta name="theme-color" content="#f8fafc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <!-- Session & Auto-Redirect Guard -->
  <script src="/auth-guard.js"></script>

  <style>
    :root {
      --bg-color: #f8fafc; 
      --card-bg: rgba(255, 255, 255, 0.85); 
      --border-color: rgba(255, 255, 255, 0.5);
      --text-main: #0f172a; 
      --text-muted: #64748b;
      --brand-accent: #4f46e5; 
      --brand-dark: #3730a3;
      --brand-light: #e0e7ff;
    }

    /* PWA Optimizations */
    body, html {
      margin: 0; padding: 0; 
      background-color: var(--bg-color);
      font-family: 'Comfortaa', cursive; 
      height: 100vh; overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    
    input { user-select: auto; }

    /* Animated Ambient Background */
    .ambient-bg {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: -1; overflow: hidden; background: #f8fafc;
    }
    .blob {
      position: absolute; filter: blur(80px); opacity: 0.5;
      border-radius: 50%; animation: float 12s infinite ease-in-out alternate;
    }
    .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: var(--brand-accent); animation-delay: 0s; }
    .blob-2 { bottom: -10%; right: -10%; width: 60vw; height: 60vw; background: #818cf8; animation-delay: -2s; animation-direction: alternate-reverse; }
    .blob-3 { top: 40%; left: 60%; width: 40vw; height: 40vw; background: #c7d2fe; animation-delay: -4s; }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(5%, 10%) scale(1.1); }
      100% { transform: translate(-5%, -5%) scale(0.9); }
    }

    /* Layout Structure */
    .login-wrapper { 
      display: flex; height: 100vh; width: 100vw; 
      align-items: center; justify-content: center;
      padding: 20px; box-sizing: border-box;
    }

    /* Glassmorphism Card */
    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-color); 
      border-radius: 32px;
      width: 100%; max-width: 420px; 
      padding: 48px 32px; 
      text-align: center; 
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255,255,255,1);
      
      /* Staggered Entrance Setup */
      opacity: 0; transform: translateY(30px);
      animation: fadeUpCard 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Header Elements */
    .brand-icon-wrapper {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, var(--brand-accent) 0%, var(--brand-dark) 100%);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px auto;
      box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4);
      opacity: 0; animation: fadeUpItem 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
    }
    .brand-icon { font-size: 2.2rem; color: white; }

    .brand-title { 
      font-family: 'Lexend', sans-serif; font-weight: 700; font-size: 1.7rem; 
      color: var(--text-main); margin: 0 0 8px 0; letter-spacing: -0.02em;
      opacity: 0; animation: fadeUpItem 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }
    .brand-subtitle { 
      color: var(--text-muted); font-size: 0.95rem; margin: 0 0 40px 0; font-weight: 500;
      opacity: 0; animation: fadeUpItem 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
    }

    /* Interactive Inputs */
    .input-container {
      opacity: 0; animation: fadeUpItem 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
    }
    .input-group { 
      position: relative; margin-bottom: 20px; text-align: left; 
    }
    .input-icon { 
      position: absolute; top: 50%; transform: translateY(-50%); left: 20px; 
      color: #94a3b8; font-size: 1.25rem; transition: all 0.3s ease; 
      pointer-events: none;
    }
    .minimal-input {
      border-radius: 16px; padding: 18px 20px 18px 56px; 
      border: 2px solid transparent; 
      background-color: rgba(241, 245, 249, 0.7);
      font-family: 'Lexend', sans-serif; font-weight: 500; color: var(--text-main); 
      width: 100%; font-size: 1rem; transition: all 0.3s ease; box-sizing: border-box;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    }
    .minimal-input::placeholder { color: #94a3b8; font-weight: 400; }
    
    /* Input Micro-interactions */
    .minimal-input:focus { 
      outline: none; border-color: var(--brand-accent); 
      background-color: #ffffff;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.1);
    }
    .input-group:focus-within .input-icon { 
      color: var(--brand-accent); transform: translateY(-50%) scale(1.1);
    }

    /* Primary Button */
    .btn-container {
      opacity: 0; animation: fadeUpItem 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
    }
    .btn-primary-custom {
      font-family: 'Lexend', sans-serif; font-weight: 600; 
      background: linear-gradient(135deg, var(--brand-accent) 0%, var(--brand-dark) 100%);
      color: white; border: none; padding: 18px; border-radius: 16px; 
      cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex; align-items: center; justify-content: center; gap: 10px; 
      width: 100%; font-size: 1.1rem; margin-top: 12px;
      box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4);
    }
    .btn-primary-custom:active { 
      transform: scale(0.97); 
      box-shadow: 0 5px 10px -5px rgba(79, 70, 229, 0.4);
    }
    .btn-primary-custom:disabled { 
      background: #cbd5e0; box-shadow: none; cursor: not-allowed; transform: none; 
    }

    /* Alerts */
    .custom-alert { 
      border-radius: 14px; font-family: 'Lexend', sans-serif; font-size: 0.9rem; 
      padding: 16px; margin-bottom: 24px; text-align: left; display: none; 
      align-items: center; gap: 10px; font-weight: 500;
      animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
    }
    .alert-danger { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; }

    /* Animations */
    @keyframes fadeUpCard { 
      0% { opacity: 0; transform: translateY(40px) scale(0.98); } 
      100% { opacity: 1; transform: translateY(0) scale(1); } 
    }
    @keyframes fadeUpItem { 
      0% { opacity: 0; transform: translateY(15px); } 
      100% { opacity: 1; transform: translateY(0); } 
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }

    /* Spinner Class */
    .loading-spinner { animation: spin 1s linear infinite; display: inline-block; }

    /* Desktop Adjustments */
    @media (min-width: 900px) {
      .login-card { padding: 60px 48px; max-width: 480px; }
      .blob-1 { width: 30vw; height: 30vw; }
      .blob-2 { width: 40vw; height: 40vw; }
      .blob-3 { width: 25vw; height: 25vw; }
    }
  </style>
</head>
<body>

  <!-- Ambient Animated Background -->
  <div class="ambient-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="login-wrapper">
    <div class="login-card">
      
      <div class="brand-icon-wrapper">
        <i class="bi bi-box-seam-fill brand-icon"></i>
      </div>
      
      <h1 class="brand-title">Al-Farha Cargo</h1>
      <p class="brand-subtitle">Enterprise Logistics Portal</p>
      
      <div id="login-alert" class="custom-alert alert-danger"></div>
      
      <div class="input-container">
        <div class="input-group">
          <i class="bi bi-person input-icon"></i>
          <input type="text" class="minimal-input" id="userId" placeholder="User ID" autocomplete="off" spellcheck="false">
        </div>
        
        <div class="input-group">
          <i class="bi bi-shield-lock input-icon"></i>
          <input type="password" class="minimal-input" id="pin" placeholder="Password / PIN">
        </div>
      </div>
      
      <div class="btn-container">
        <button id="loginBtn" class="btn-primary-custom" onclick="processLogin()">
          <span>Secure Sign In</span>
          <i class="bi bi-arrow-right-short" style="font-size: 1.4rem;"></i>
        </button>
      </div>

    </div>
  </div>

  <script>
    // Your Live Google Apps Script API URL
    const GOOGLE_API_URL = "https://script.google.com/macros/s/AKfycbwycWJw0iiCfF9ZFfj3rNpBsfiITySuJrvlSgmFW10aFBR1Qx0xwmTv30jRlZW83f-oSw/exec";

    async function processLogin() {
      const userId = document.getElementById('userId').value.trim();
      const pin = document.getElementById('pin').value.trim();
      const alertDiv = document.getElementById('login-alert');
      const loginBtn = document.getElementById('loginBtn');

      if (!userId || !pin) {
        alertDiv.innerHTML = '<i class="bi bi-exclamation-triangle-fill" style="font-size:1.1rem;"></i> Please enter both ID and PIN.';
        alertDiv.style.display = 'flex';
        
        // Retrigger shake animation
        alertDiv.style.animation = 'none';
        alertDiv.offsetHeight; /* trigger reflow */
        alertDiv.style.animation = null; 
        return;
      }

      alertDiv.style.display = 'none';
      
      // Loading State Micro-interaction
      loginBtn.innerHTML = '<i class="bi bi-arrow-repeat loading-spinner" style="font-size: 1.4rem;"></i> <span>Authenticating...</span>';
      loginBtn.disabled = true;

      try {
        const response = await fetch(GOOGLE_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8',
          },
          redirect: "follow",
          body: JSON.stringify({
            action: "authenticate",
            userId: userId,
            pin: pin
          })
        });
        
        const data = await response.json();
        
        if (data.success) {
          // Success State Micro-interaction
          loginBtn.innerHTML = '<i class="bi bi-check-circle-fill" style="font-size: 1.4rem;"></i> <span>Success!</span>';
          loginBtn.style.background = '#10b981'; // Green success color
          loginBtn.style.boxShadow = '0 10px 20px -5px rgba(16, 185, 129, 0.4)';
          
          localStorage.setItem('afc_user', JSON.stringify(data.user));
          
          // Store the active timestamp upon login for auth-guard
          localStorage.setItem('afc_last_active', Date.now().toString());
          
          // Slight delay for smooth transition feel
          setTimeout(() => {
            if (window.innerWidth <= 900) {
              window.location.href = '/mobiledashboard.html';
            } else {
              window.location.href = '/dashboard.html';
            }
          }, 400);

        } else {
          throw new Error(data.message);
        }
      } catch (error) {
        alertDiv.innerHTML = `<i class="bi bi-x-circle-fill" style="font-size:1.1rem;"></i> <span>${error.message || 'Network Error. Please check connection.'}</span>`;
        alertDiv.style.display = 'flex';
        
        // Reset Button
        loginBtn.innerHTML = '<span>Secure Sign In</span> <i class="bi bi-arrow-right-short" style="font-size: 1.4rem;"></i>';
        loginBtn.disabled = false;
        
        // Retrigger shake animation
        alertDiv.style.animation = 'none';
        alertDiv.offsetHeight; 
        alertDiv.style.animation = null; 
      }
    }

    // Enter key support
    document.getElementById('pin').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') processLogin();
    });
    document.getElementById('userId').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') document.getElementById('pin').focus();
    });
  </script>
</body>
</html>
